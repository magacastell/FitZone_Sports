<text font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="42.5">FitZone Sports | UML — Acceso offline y reconciliación</tspan></text>
<text font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="82.5">Escenario del QR automático; egreso y reintentos conservan la visita/evento original. No se garantiza RN-01 entre sedes aisladas.</tspan></text>
<rect x="550" y="257" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="275.0">POST /preparacion (terminalId; sesión de Recepción)</tspan></text>
<rect x="1270" y="317" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="335.0">Registrar terminal y copia firmada</tspan></text>
<rect x="550" y="377" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="395.0">Copia v2 + JWK + hora central (hasta 2 h)</tspan></text>
<rect x="550" y="437" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="455.0">Verificar y guardar copia / confianza</tspan></text>
<rect x="190" y="497" width="1060" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="515.0">POST /credenciales/automaticas (sesión del socio; sin sede)</tspan></text>
<rect x="190" y="557" width="1060" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="575.0">Ventanas RS256 ≤ 60 s, períodos pagados y horizonte ≤ 2 h; el portal guarda el lote en su propio IndexedDB</tspan></text>
<rect x="190" y="772" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" y="790.0">Mostrar / leer QR vigente</tspan></text>
<rect x="550" y="928" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="944.7">Transacción: evento UUID + presencia +</tspan><tspan x="720.0" y="966.3000000000001">uso jti + secuencia</tspan></text>
<rect x="550" y="1007" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1025.0">Commit local; si falla, no hay éxito</tspan></text>
<rect x="410" y="1185" width="620" height="32" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1201.0">opt [egreso con copia vigente]</tspan></text>
<rect x="550" y="1218" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1234.7">SALIDA: misma visita, otro UUID;</tspan><tspan x="720.0" y="1256.3">actualizar presencia y cola</tspan></text>
<rect x="550" y="1397" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1415.0">POST /sincronizacion: ≤ 100 eventos con UUID original y revisión</tspan></text>
<rect x="1270" y="1438" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="1454.7">TX: inbox y bloqueo; integrar visita o</tspan><tspan x="1440.0" y="1476.3">conservar conflicto</tspan></text>
<rect x="1270" y="1498" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="1514.7">Commit conjunto de inbox, resultado y</tspan><tspan x="1440.0" y="1536.3">acceso</tspan></text>
<rect x="410" y="1613" width="1315" height="30" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1628.0">alt [ACK recibido]</tspan></text>
<rect x="550" y="1647" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1665.0">Por UUID: CONFIRMADO / CONFLICTO / RECHAZADO / EN_ESPERA</tspan></text>
<rect x="550" y="1688" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1704.7">Guardar resultado; EN_ESPERA sigue</tspan><tspan x="720.0" y="1726.3">PENDIENTE</tspan></text>
<rect x="410" y="1797" width="1315" height="30" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1812.0">[respuesta perdida: conservar pendientes y reintentar]</tspan></text>
<rect x="550" y="1827" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1845.0">Reintentar mismo UUID y contenido (no crear otro evento)</tspan></text>
<rect x="550" y="1877" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1895.0">Resultado almacenado (repetido=true); sin nueva visita</tspan></text>
<rect x="45" y="1965" width="1710" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="45" y="1992.5">Copia validada al capturar; recibirla vencida no invalida por sí solo el evento. Conflictos preservados; resolución administrativa pendiente.</tspan></text>
<text font-family="Arial, sans-serif" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="2065.0">UML: línea continua = llamada; discontinua = respuesta / línea de vida; opt/alt = fragmentos combinados; notas = acciones y condiciones.</tspan></text>
<text font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="2103.0">Autor nominal: pendiente de revisión grupal | Fecha de edición: 2026-11-10 | v1 | Código: d4ceaa3</tspan></text>

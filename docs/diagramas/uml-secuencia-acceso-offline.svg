<rect x="1125" y="125" width="270" height="80" fill="#dceefa" stroke="#16324f" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1260.0" y="152.85">API central</tspan><tspan x="1260.0" y="177.15">Spring / M2</tspan></text>
<rect x="1485" y="125" width="270" height="80" fill="#dceefa" stroke="#16324f" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1620.0" y="152.85">PostgreSQL</tspan><tspan x="1620.0" y="177.15">central</tspan></text>
<rect x="40" y="225" width="1720" height="32" fill="#edf2f7" stroke="#94a3b8" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="241.0">1. Con conexión de Recepción: aprovisionar el terminal antes de su desconexión</tspan></text>
<rect x="40" y="520" width="1720" height="32" fill="#edf2f7" stroke="#94a3b8" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="536.0">2. Recepción pierde conectividad; el socio puede seguir conectado por su propia red</tspan></text>
<rect x="40" y="745" width="1720" height="32" fill="#edf2f7" stroke="#94a3b8" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="761.0">3. Terminal sin conexión al central: validación local y captura provisional</tspan></text>
<rect x="45" y="790" width="270" height="90" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="180.0" y="813.4">Selecciona ventana guardada.</tspan><tspan x="180.0" y="835.0">Si el socio también está sin red,</tspan><tspan x="180.0" y="856.6">necesita un lote previo vigente.</tspan></text>
<rect x="395" y="950" width="650" height="80" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="978.525">Terminal: validar copia/operador, firma con JWK confiable,</tspan><tspan x="720.0" y="1001.475">audiencia, kid, tipo, fechas, bloqueos y presencia conocidos.</tspan></text>
<rect x="395" y="1190" width="650" height="55" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1217.5">UI de Recepción: ingreso y aforo provisionales; cola PENDIENTE.</tspan></text>
<rect x="395" y="1280" width="650" height="130" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="1450" width="1720" height="32" fill="#edf2f7" stroke="#94a3b8" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1466.0">4. Reconexión de Recepción: sesión del operador original, sincronización transaccional y ACK</tspan></text>

<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="241.0">1. Con conexión: preparación autenticada y obtención automática</tspan></text>
<rect x="40" y="645" width="1720" height="32" fill="#edf2f7" stroke="#94a3b8" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="661.0">2. Sin comunicación con el central: selección local, verificación y captura provisional</tspan></text>
<rect x="45" y="695" width="270" height="75" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="180.0" y="710.9">Seleccionar ventana vigente</tspan><tspan x="180.0" y="732.5">del lote guardado</tspan><tspan x="180.0" y="754.1">(no se firma en el móvil)</tspan></text>
<rect x="395" y="850" width="650" height="80" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="878.525">Terminal: validar copia/operador, firma con JWK confiable,</tspan><tspan x="720.0" y="901.475">audiencia, kid, tipo, fechas, bloqueos y presencia conocidos.</tspan></text>
<rect x="395" y="1090" width="650" height="55" fill="#fff8dc" stroke="#ad8c40" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1117.5">UI de Recepción: ingreso y aforo provisionales; cola PENDIENTE.</tspan></text>

<text font-family="Arial, sans-serif" font-size="26" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="42.5">FitZone Sports | UML — Acceso offline y reconciliación</tspan></text>
<text font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="82.5">Recepción puede estar sin red y el socio obtener el QR con conexión propia. La terminal requiere aprovisionamiento previo vigente.</tspan></text>
<rect x="550" y="257" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="275.0">POST /preparacion (terminalId; sesión de Recepción)</tspan></text>
<rect x="1270" y="317" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="335.0">Registrar terminal y copia firmada</tspan></text>
<rect x="550" y="377" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="395.0">Copia v2 + JWK + hora central (hasta 2 h)</tspan></text>
<rect x="550" y="437" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="455.0">Verificar y guardar copia / confianza</tspan></text>
<rect x="190" y="567" width="1060" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="585.0">POST /credenciales/automaticas por la conexión del socio (sesión válida; sin sede)</tspan></text>
<rect x="190" y="627" width="1060" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="645.0">Ventanas RS256 ≤ 60 s, períodos pagados y horizonte ≤ 2 h; guardar lote en IndexedDB del socio</tspan></text>
<rect x="190" y="882" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" y="900.0">Mostrar / leer QR vigente</tspan></text>
<rect x="550" y="1028" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1044.7">Transacción: evento UUID + presencia +</tspan><tspan x="720.0" y="1066.3">uso jti + secuencia</tspan></text>
<rect x="550" y="1107" width="340" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1125.0">Commit local; si falla, no hay éxito</tspan></text>
<rect x="410" y="1285" width="620" height="32" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1301.0">opt [egreso con copia vigente]</tspan></text>
<rect x="550" y="1318" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1334.7">SALIDA: misma visita, otro UUID;</tspan><tspan x="720.0" y="1356.3">actualizar presencia y cola</tspan></text>
<rect x="550" y="1497" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1515.0">POST /sincronizacion: ≤ 100 eventos con UUID original y revisión</tspan></text>
<rect x="1270" y="1538" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="1554.7">TX: inbox y bloqueo; integrar visita o</tspan><tspan x="1440.0" y="1576.3">conservar conflicto</tspan></text>
<rect x="1270" y="1598" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="1440.0" y="1614.7">Commit conjunto de inbox, resultado y</tspan><tspan x="1440.0" y="1636.3">acceso</tspan></text>
<rect x="410" y="1713" width="1315" height="30" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1728.0">alt [ACK recibido]</tspan></text>
<rect x="550" y="1747" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1765.0">Por UUID: CONFIRMADO / CONFLICTO / RECHAZADO / EN_ESPERA</tspan></text>
<rect x="550" y="1788" width="340" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="720.0" y="1804.7">Guardar resultado; EN_ESPERA sigue</tspan><tspan x="720.0" y="1826.3">PENDIENTE</tspan></text>
<rect x="410" y="1897" width="1315" height="30" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#16324f" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="410" y="1912.0">[respuesta perdida: conservar pendientes y reintentar]</tspan></text>
<rect x="550" y="1927" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1945.0">Reintentar mismo UUID y contenido (no crear otro evento)</tspan></text>
<rect x="550" y="1977" width="700" height="36" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="900.0" y="1995.0">Resultado almacenado (repetido=true); sin nueva visita</tspan></text>
<rect x="45" y="2065" width="1710" height="55" fill="white" stroke="none" stroke-width="2"/>
<text font-family="Arial, sans-serif" font-size="17" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="45" y="2092.5">Copia validada al capturar; caducidad posterior no invalida por sí sola el evento. Conflictos preservados; RN-01 global no garantizado sin red.</tspan></text>
<text font-family="Arial, sans-serif" font-size="15" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="2165.0">UML: continua = llamada; discontinua = respuesta / línea de vida; opt/alt = fragmentos combinados. La caída afecta a Recepción, no necesariamente al socio.</tspan></text>
<text font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start" dominant-baseline="middle"><tspan x="35" y="2203.0">Autor nominal: pendiente de revisión grupal | Fecha de edición: 2026-11-10 | v2 | Código: d4ceaa3</tspan></text>

  <title id="diagram-title">FitZone Sports | C4 nivel 3 — Componentes del backend M2</title>
  <metadata id="document-metadata" data-author="Magali Castell" data-edition-date="2026-11-19" data-document-version="v3" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="2020" height="1430" fill="white" />
  <g id="e4">
    <rect x="720" y="130" width="1240" height="1030" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" />
  </g>
  <g id="e6">
    <rect x="35" y="145" width="420" height="985" fill="#edf2f7" stroke="#a1b1c3" stroke-width="2" />
  </g>
  <g id="portal-socio">
    <rect x="55" y="222" width="380" height="126" fill="#ffffff" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="245" y="248.55">Portal del socio · Mi QR</tspan>
      <tspan x="245" y="272.85">Presenta el QR que rota cada minuto</tspan>
      <tspan x="245" y="297.15">Sin conexión, usa su lote vigente</tspan>
      <tspan x="245" y="321.45">obtenido en línea y guardado en IndexedDB.</tspan>
    </text>
  </g>
  <g id="terminal-sede">
    <rect x="55" y="501" width="380" height="254" fill="#ffffff" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="245" y="542.95">Terminal de sede · Recepción</tspan>
      <tspan x="245" y="567.25">Lee el QR con la misma PWA</tspan>
      <tspan x="245" y="591.55">Sin comunicación: requiere copia vigente</tspan>
      <tspan x="245" y="615.85">Verifica firma y vigencia del QR y la copia</tspan>
      <tspan x="245" y="640.15">Comprueba la sede del terminal</tspan>
      <tspan x="245" y="664.45">Contrasta bloqueos y presencia conocida</tspan>
      <tspan x="245" y="688.75">Aforo provisional: presencias locales</tspan>
      <tspan x="245" y="713.05">y capacidad máxima de la copia</tspan>
    </text>
  </g>
  <g id="datos-terminal">
    <rect x="55" y="848" width="380" height="128" fill="#e1f1e9" stroke="#176b58" stroke-width="2" stroke-dasharray="8 5" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="245" y="887.70">IndexedDB · Dexie del terminal</tspan>
      <tspan x="245" y="912.00">Copia firmada y presencias locales</tspan>
      <tspan x="245" y="936.30">Movimientos pendientes por UUID</tspan>
    </text>
  </g>
  <g id="e7">
    <rect x="55" y="1001" width="380" height="103" fill="#fff8dc" stroke="#ad8c40" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="17" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="245" y="1029.55">Dos sedes aisladas pueden conceder</tspan>
      <tspan x="245" y="1052.50">ingresos provisionales incompatibles.</tspan>
      <tspan x="245" y="1075.45">El servidor detecta el conflicto al reconciliar.</tspan>
    </text>
  </g>
  <g id="e8">
    <rect x="770" y="230" width="500" height="150" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1020" y="280.70">OfflineController</tspan>
      <tspan x="1020" y="305.00">[Componente: REST / seguridad]</tspan>
      <tspan x="1020" y="329.30">Emisión, preparación y sincronización</tspan>
    </text>
  </g>
  <g id="e9">
    <rect x="1400" y="230" width="500" height="100" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1650" y="255.70">AccesoController</tspan>
      <tspan x="1650" y="280.00">[Componente: REST online]</tspan>
      <tspan x="1650" y="304.30">Ingreso, egreso y consulta de aforo</tspan>
    </text>
  </g>
  <g id="e10">
    <rect x="770" y="450" width="500" height="130" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1020" y="478.55">Provisión / emisión offline</tspan>
      <tspan x="1020" y="502.85">[Component: servicios Spring]</tspan>
      <tspan x="1020" y="527.15">AutorizacionQrService · TerminalOfflineService</tspan>
      <tspan x="1020" y="551.45">CredencialOfflineService (compatibilidad)</tspan>
    </text>
  </g>
  <g id="e11">
    <rect x="1400" y="450" width="500" height="155" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1650" y="466.75">Validación online y aforo</tspan>
      <tspan x="1650" y="491.05">[Componente: servicios Spring]</tspan>
      <tspan x="1650" y="515.35">AccesoService · QrTokenService (HMAC legado)</tspan>
      <tspan x="1650" y="539.65">Vigencia y presencia global · bloqueo por titular</tspan>
      <tspan x="1650" y="563.95">Aforo central: visitas abiertas por sede</tspan>
      <tspan x="1650" y="588.25">y capacidad máxima configurada</tspan>
    </text>
  </g>
  <g id="e12">
    <rect x="770" y="700" width="500" height="110" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1020" y="730.70">FirmaOffline</tspan>
      <tspan x="1020" y="755.00">[Component: firma / verificación RS256]</tspan>
      <tspan x="1020" y="779.30">Privada RSA persistente; JWK pública de confianza</tspan>
    </text>
  </g>
  <g id="e13">
    <rect x="1400" y="700" width="500" height="110" fill="#edf2f7" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1650" y="730.70">Servicios de usuario, membresía y sede</tspan>
      <tspan x="1650" y="755.00">[Componentes Spring colaboradores]</tspan>
      <tspan x="1650" y="779.30">Estado comercial, capacidad y permisos</tspan>
    </text>
  </g>
  <g id="e14">
    <rect x="770" y="950" width="500" height="120" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1020" y="973.55">SincronizacionOfflineService</tspan>
      <tspan x="1020" y="997.85">[Componente: reconciliación transaccional]</tspan>
      <tspan x="1020" y="1022.15">Compara intervalos y conserva conflictos</tspan>
      <tspan x="1020" y="1046.45">Bandeja de entrada y resultado por UUID</tspan>
    </text>
  </g>
  <g id="e15">
    <rect x="1400" y="950" width="500" height="120" fill="#dceefa" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="18" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1650" y="985.70">Repositorios de acceso</tspan>
      <tspan x="1650" y="1010.00">[Componentes: Spring Data JPA]</tspan>
      <tspan x="1650" y="1034.30">RegistroAccesoRepository · CodigoQrRepository</tspan>
    </text>
  </g>
  <g id="e16">
    <rect x="770" y="1240" width="1130" height="100" fill="#e1f1e9" stroke="#16324f" stroke-width="2" />
    <text font-family="Arial, sans-serif" font-size="20" fill="#16324f" font-weight="normal" text-anchor="middle" dominant-baseline="middle">
      <tspan x="1335" y="1263.00">PostgreSQL central</tspan>
      <tspan x="1335" y="1290.00">[Contenedor de datos externo a la API]</tspan>
      <tspan x="1335" y="1317.00">RN-01: una visita abierta por socio (V4) · QR multisede de un uso (V14)</tspan>
    </text>
  </g>

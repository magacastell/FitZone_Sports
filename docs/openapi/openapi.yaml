      x-contract-status: stable
    Dinero:
      type: object
      additionalProperties: false
      properties:
        importe:
          type: number
          example: 15000
          x-propuesta-validacion:
            minimum: 0
            multipleOf: 0.01
        moneda:
          type: string
          example: ARS
          x-propuesta-descripcion: Código ISO 4217; los reportes no suman monedas diferentes.
          x-propuesta-validacion:
            pattern: ^[A-Z]{3}$
      x-propuesta-required:
      - importe
      - moneda
      x-contract-status: draft
      description: Schema de trabajo draft. Campos, variantes y valores funcionales son propuestas, no requisitos
        cerrados; x-propuesta-required/valores preserva el diseño previo para revisión. Los ejemplos no fijan políticas.
    PlanRequest:
      type: object
      description: |-
        DTO actual de creación. Nombre no vacío, recortado por el servicio y único sin distinguir mayúsculas.
        Precio como número decimal en ARS, no como objeto Dinero. Crea un plan activo.
      required:
      - nombre
      - duracionMeses
      - precio
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '[\s\S]*\S[\s\S]*'
          example: Mensual
        duracionMeses:
          type: integer
          format: int32
          enum: [1, 3, 12]
          example: 1
        precio:
          type: number
          description: ARS; positivo, hasta 19 dígitos enteros y dos decimales (@Digits y numeric(21,2)).
          minimum: 0
          exclusiveMinimum: true
          maximum: 10000000000000000000
          exclusiveMaximum: true
          multipleOf: 0.01
          example: 15000.50
      x-contract-status: stable
    ActualizarPlanRequest:
      type: object

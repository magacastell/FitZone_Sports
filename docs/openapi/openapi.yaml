        La respuesta lleva Cache-Control: no-store. El token se firma con una clave derivada de jwt.secret, distinta
        de la del login: no sirve como Bearer.
        La autoridad habilita solicitar QR; cuenta activa y membresía vigente no suspendida son obligatorias.
        M1/M2 validan períodos reales, sin depender del nombre del actor funcional ni de la sede habitual.

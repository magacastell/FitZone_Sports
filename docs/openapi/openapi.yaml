openapi: 3.0.3
info:
  title: FitZone Sports — Contrato objetivo API v1
  version: 1.0.0
  description: |-
    Contrato API v1 para trabajar en paralelo. Los dos ejes son independientes:
    x-implementation-status: implemented = lógica funcional actual; stub = ruta existente sin caso de uso implementado. El HTTP 501 actual se registra sólo en x-implementation-note, nunca como respuesta objetivo.
    x-contract-status: stable = interfaz respaldada por código funcional o decisión técnica de contrato explícita; draft = interfaz de trabajo con reglas funcionales pendientes de validar por el equipo. Un stub puede tener contrato stable. Un implemented puede mantener propuestas de evolución sin convertirlas en requisitos.
    openapi.yaml es la fuente técnica de las partes stable. Las partes draft sirven para revisión y mocks; no obligan a otros módulos ni deben usarse como acuerdos definitivos para generar validaciones de negocio. x-contract-pending referencia temas P01–P12 de DECISIONES.md. x-propuesta-* preserva alternativas anteriores como metadata no normativa.
    JWT/Bearer global. Login y registro públicos. GET /sedes conserva la autorización actual; su apertura pública está propuesta en P12. x-roles-actuales registra las anotaciones del controller, sin afirmar que existan validaciones funcionales de propiedad/sede en stubs. Las modificaciones de permisos se separan como propuestas.
    DTO implementados exactos; PATCH application/json con omitido/null = no modificar. Problem Details con code y errores de campo es objetivo técnico, no garantía del runtime actual. Paginación selectiva base 0, size 20 y máximo 100; operationId únicos en español.
    Campos/precios/estados futuros, coordinación entre módulos, métricas y políticas permanecen draft cuando falta acuerdo. No se adjudica autoridad de equipo a D1–D20 del intercambio anterior. Las propuestas de nuevas rutas de sincronización y cancelación de membresía están sólo en DECISIONES.md.
    No se modifica backend, frontend, migraciones, dependencias ni configuración.
servers:
- url: http://localhost:3000/api/v1
  description: Servidor local; los paths son relativos a /api/v1.
tags:
- name: Auth
  description: Autenticación pública.
- name: M1 · Usuarios
  description: Perfiles, usuarios y sedes.
- name: M1 · Membresías
  description: Planes, períodos de membresía y renovaciones.
- name: M2 · Accesos
  description: Ingresos, salidas, aforo informativo y sincronización offline.
- name: M3 · Clases
  description: Agenda, cupos, asistencia, faltas y lista de espera.
- name: M4 · Canchas
  description: Turnos predefinidos, retenciones, reservas y mantenimiento.
- name: M5 · Pagos
  description: Pagos, compensaciones, devoluciones y comprobantes.
- name: Reportes
  description: Analítica histórica sólo para Gerente.
security:
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: Valida email/password y devuelve el token JWT actual.
      operationId: iniciarSesion
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security: []
      x-divergencias-backend:
      - No hay contrato común Problem Details configurado actualmente.
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-roles-actuales:
      - PUBLICO
      x-contract-source:
      - src/main/java/com/fitzonesports/auth/controller/AuthController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - PUBLICO
  /auth/register:
    post:
      tags:
      - Auth
      summary: Registrar cliente
      description: Crea cliente con rol actual CLIENTE_EXTERNO. No permite elegir roles ni estado de membresía.
        sedeId debe existir; email duplicado produce 409. DNI es único en BD, pero su conflicto todavía no se traduce
        explícitamente en el servicio.
      operationId: registrarCliente
      x-implementation-status: implemented
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
      security: []
      x-divergencias-backend:
      - Conflicto DNI depende actualmente de BD y no tiene traducción explícita a 409.
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:

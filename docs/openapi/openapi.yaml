components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por login o registro. El servidor resuelve actor, permisos, propiedad y sede.
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          pattern: .*\S.*
          example: cliente@fitzone.com
        password:
          type: string
          writeOnly: true
          minLength: 1
          pattern: .*\S.*
          example: claveSegura123
      x-contract-status: stable
    LoginResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGllbnRlQGZpdHpvbmUuY29tIn0.firma
      x-contract-status: stable
    RegisterResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGllbnRlQGZpdHpvbmUuY29tIn0.firma
      x-contract-status: stable
    RegisterRequest:
      type: object
      description: Alta comercial sin sede habitual. El servidor asigna USUARIO y sede null; no acepta asignación de personal ni afiliación durante registro.
      required:
      - nombre
      - apellido
      - dni
      - email
      - password
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: Ana
        apellido:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: Pérez
        dni:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: '30123456'
        email:
          type: string
          format: email
          minLength: 1
          pattern: .*\S.*
          example: ana@ejemplo.com
        password:
          type: string
          minLength: 8
          pattern: .*\S.*
          writeOnly: true
          example: claveSegura123
      x-contract-status: stable
    UsuarioResponse:
      type: object
      required:
      - id
      - nombre
      - apellido
      - dni
      - email
      - activo
      - rol
      - sedeId
      - sedeNombre
      - foto
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
        dni:
          type: string
          example: '30123456'
        email:
          type: string
          example: ana@ejemplo.com
        foto:
          type: string
          nullable: true
          example: perfil-ana.jpg
        activo:
          type: boolean
          example: true
        rol:
          type: string
          description: 'String del DTO actual. Roles sembrados: USUARIO, RECEPCIONISTA y GERENTE.
            La autoridad es estable; Socio es condición derivada de membresía, no un rol JWT.'
          example: USUARIO
        sedeId:
          type: integer
          nullable: true
          description: Sede habitual comercial, opcional antes del alta; sede operativa obligatoria del personal.
          format: int32
          example: 1
        sedeNombre:
          type: string
          nullable: true
          example: Centro
      x-contract-status: stable
    ActualizarPerfilRequest:

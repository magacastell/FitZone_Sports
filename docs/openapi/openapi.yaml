openapi: 3.0.3
info:
  title: FitZone Sports — Contrato objetivo API v1
  version: 1.0.0
  description: |-
    Contrato API v1 para trabajar en paralelo. Los dos ejes son independientes:
    x-implementation-status: implemented = lógica funcional actual; stub = ruta existente sin caso de uso implementado. El HTTP 501 actual se registra sólo en x-implementation-note, nunca como respuesta objetivo.
    x-contract-status: stable = interfaz respaldada por código funcional o decisión técnica de contrato explícita; draft = interfaz de trabajo con reglas funcionales pendientes de validar por el equipo. Un stub puede tener contrato stable. Un implemented puede mantener propuestas de evolución sin convertirlas en requisitos.
    openapi.yaml es la fuente técnica de las partes stable. Las partes draft sirven para revisión y mocks; no obligan a otros módulos ni deben usarse como acuerdos definitivos para generar validaciones de negocio. x-contract-pending referencia temas P01–P12 de DECISIONES.md. x-propuesta-* preserva alternativas anteriores como metadata no normativa.
    JWT/Bearer global. Login y registro públicos. GET /sedes conserva la autorización actual; la elección de sede ocurre autenticada al contratar (P12). x-roles-actuales registra las anotaciones del controller, sin afirmar que existan validaciones funcionales de propiedad/sede en stubs. Las modificaciones de permisos se separan como propuestas.
    DTO implementados exactos; PATCH application/json con omitido/null = no modificar. Problem Details con code y errores de campo es objetivo técnico, no garantía del runtime actual. Paginación selectiva base 0, size 20 y máximo 100; operationId únicos en español.
    Campos/precios/estados futuros, coordinación entre módulos, métricas y políticas permanecen draft cuando falta implementación o acuerdo. Las rutas de membresías reflejan el backend con cobros fake y arrepentimiento por período; ver docs/membresias.md. La sincronización offline continúa como propuesta en DECISIONES.md.
servers:
- url: http://localhost:3000/api/v1
  description: Servidor local; los paths son relativos a /api/v1.
tags:
- name: Auth
  description: Autenticación pública.
- name: M1 · Usuarios
  description: Perfiles, usuarios y sedes.
- name: M1 · Membresías
  description: Planes, períodos de membresía y renovaciones.
- name: M2 · Accesos
  description: Ingresos, salidas, aforo informativo y sincronización offline.
- name: M3 · Clases
  description: Agenda, cupos, asistencia, faltas y lista de espera.
- name: M4 · Canchas
  description: Turnos predefinidos, retenciones, reservas y mantenimiento.
- name: M5 · Pagos
  description: Pagos, compensaciones, devoluciones y comprobantes.
- name: Reportes
  description: Analítica histórica sólo para Gerente.
security:
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: Valida email/password y devuelve el token JWT actual.
      operationId: iniciarSesion
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security: []
      x-divergencias-backend:
      - No hay contrato común Problem Details configurado actualmente.
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-roles-actuales:
      - PUBLICO
      x-contract-source:
      - src/main/java/com/fitzonesports/auth/controller/AuthController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - PUBLICO
  /auth/register:
    post:
      tags:
      - Auth
      summary: Registrar cliente
      description: Crea cliente con rol actual USUARIO. No permite elegir roles ni estado de membresía.
        No recibe sede; el alta comercial queda sin sede habitual. Email duplicado produce 409. DNI es único en BD, pero su conflicto todavía no se traduce
        explícitamente en el servicio.
      operationId: registrarCliente
      x-implementation-status: implemented
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '409':
          $ref: '#/components/responses/Conflicto'
      security: []
      x-divergencias-backend:
      - Conflicto DNI depende actualmente de BD y no tiene traducción explícita a 409.
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      x-roles-actuales:
      - PUBLICO
      x-contract-source:
      - src/main/java/com/fitzonesports/auth/controller/AuthController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - PUBLICO
  /usuarios/me:
    get:
      tags:
      - M1 · Usuarios
      summary: Consultar mi perfil
      description: Titular derivado exclusivamente del JWT. DTO actual sin contraseña ni estado de membresía.
      operationId: consultarPerfil
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      x-roles-actuales:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/usuario/controller/UsuarioController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
    patch:
      tags:
      - M1 · Usuarios
      summary: Actualizar mi perfil
      description: Sólo datos de perfil del titular del JWT. Omitido/null no modifica; no cambia activo, rol, email,
        DNI ni sede.
      operationId: actualizarPerfil
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      x-roles-actuales:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/usuario/controller/UsuarioController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
  /usuarios:
    get:
      tags:
      - M1 · Usuarios
      summary: Listar usuarios
      description: Recepción lista usuarios de su sede; Gerente consulta todas o filtra. Orden por id ascendente.
        La respuesta objetivo es paginada y cada item conserva el DTO actual.
      operationId: listarUsuarios
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
      x-divergencias-backend:
      - El backend devuelve List<UsuarioResponse> sin paginación; page/size aún no existen. Recepción puede leer
        personal de su sede; sólo su modificación está restringida a clientes.
      parameters:
      - $ref: '#/components/parameters/SedeFiltro'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      x-roles-actuales:
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/usuario/controller/UsuarioController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - RECEPCIONISTA
      - GERENTE
  /usuarios/{usuarioId}:
    get:
      tags:
      - M1 · Usuarios
      summary: Consultar usuario
      description: Recepción sólo usuarios de su sede, incluso personal para lectura; Gerente cualquier sede. Devuelve
        ETag objetivo para edición administrativa.
      operationId: consultarUsuario
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
      x-divergencias-backend:
      - Actualmente no se emite ETag.
      x-roles-actuales:
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/usuario/controller/UsuarioController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - RECEPCIONISTA
      - GERENTE
    patch:
      tags:
      - M1 · Usuarios
      summary: Actualizar usuario
      description: Recepción modifica sólo USUARIO de su sede. Gerente todos los roles/sedes.
        Nadie puede desactivar su propia cuenta (409). Omitido/null no modifica. If-Match objetivo protege la versión
        leída; no sustituye integridad BD.
      operationId: actualizarUsuario
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '412':
          $ref: '#/components/responses/PrecondicionFallida'
      x-divergencias-backend:
      - Actualmente no se exige If-Match ni se emite ETag.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      x-roles-actuales:
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/usuario/controller/UsuarioController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - RECEPCIONISTA
      - GERENTE
    parameters:
    - $ref: '#/components/parameters/usuarioId'
  /sedes:
    get:
      tags:
      - M1 · Usuarios
      summary: Listar sedes
      description: 'Lista autenticada de sedes como array del DTO actual: id, nombre, direccion y capacidadMaxima.
        La elección al contratar reutiliza esta ruta autenticada (P12); no se cambia
        la autorización vigente por inferencia.'
      operationId: listarSedes
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SedeResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
      x-roles-actuales:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/sede/controller/SedeController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-propuesta-pending:
      - P12
    post:
      tags:
      - M1 · Usuarios
      summary: Crear sede
      description: Nombre único sin distinguir mayúsculas; se normaliza con trim. capacidadMaxima positiva. Sólo
        Gerente.
      operationId: crearSede
      x-implementation-status: implemented
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeRequest'
      x-roles-actuales:
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/sede/controller/SedeController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - GERENTE
  /sedes/{sedeId}:
    patch:
      tags:
      - M1 · Usuarios
      summary: Actualizar sede
      description: 'Sólo Gerente. Omitido/null no modifica. Nombre único sin distinguir mayúsculas. No se agrega
        ETag: no existe una lectura individual adecuada de sede.'
      operationId: actualizarSede
      x-implementation-status: implemented
      responses:
        '200':
          description: Resultado de la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SedeResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
      requestBody:
        required: true
        description: Datos de la operación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarSedeRequest'
      x-roles-actuales:
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/sede/controller/SedeController.java
      x-contract-status: stable
      x-contract-basis: DTO/comportamiento funcional existente y convenciones técnicas del contrato.
      x-permisos-objetivo:
      - GERENTE
    parameters:
    - $ref: '#/components/parameters/sedeId'
  /planes:
    get:
      tags:
      - M1 · Membresías
      summary: Listar planes
      description: |-
        Lista planes globales activos, ordenados por duracionMeses y nombre; devuelve [] si no hay resultados.
        incluirInactivos=false por defecto. Sólo RECEPCIONISTA y GERENTE pueden usar incluirInactivos=true;
        USUARIO reciben 403 si solicitan incluir planes inactivos.
        No hay filtro por sede ni paginación en la implementación actual.
      operationId: listarPlanes
      x-implementation-status: implemented
      x-contract-status: stable
      x-contract-basis: PlanController, PlanService, DTO y migración V3 de la implementación actual.
      responses:
        '200':
          description: Array de planes; los precios se expresan como números decimales en ARS.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
      parameters:
      - name: incluirInactivos
        in: query
        required: false
        description: Incluye planes inactivos sólo para RECEPCIONISTA o GERENTE; otros roles reciben 403.
        schema:
          type: boolean
          default: false
          example: false
      x-roles-actuales:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-permisos-objetivo:
      - USUARIO
      - RECEPCIONISTA
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/membresia/controller/PlanController.java
      - src/main/java/com/fitzonesports/membresia/service/PlanService.java
      - src/main/java/com/fitzonesports/membresia/dto/PlanResponse.java
      - src/main/resources/db/migration/V3__planes_membresia.sql
      x-divergencias-backend:
      - El formato común Problem Details sigue siendo objetivo técnico; no hay manejo uniforme configurado.
    post:
      tags:
      - M1 · Membresías
      summary: Crear plan
      description: |-
        Sólo GERENTE. Requiere nombre, duracionMeses y precio; crea activo=true.
        El nombre se recorta y es único sin distinguir mayúsculas, incluso entre planes inactivos.
        duracionMeses permite 1, 3 o 12. precio es decimal positivo en ARS, con hasta 19 dígitos enteros y dos decimales.
        Datos inválidos producen 400; nombre duplicado o conflicto de integridad al guardar produce 409.
        No configura sedes habilitadas ni beneficios y no establece todavía el flujo de contratación.
      operationId: crearPlan
      x-implementation-status: implemented
      x-contract-status: stable
      x-contract-basis: PlanRequest, PlanResponse, PlanService y restricciones de V3.
      responses:
        '201':
          description: Plan creado y activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
      requestBody:
        required: true
        description: DTO actual de creación de plan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      x-roles-actuales:
      - GERENTE
      x-permisos-objetivo:
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/membresia/controller/PlanController.java
      - src/main/java/com/fitzonesports/membresia/dto/PlanRequest.java
      - src/main/java/com/fitzonesports/membresia/service/PlanService.java
      - src/main/resources/db/migration/V3__planes_membresia.sql
      x-divergencias-backend:
      - El formato común Problem Details sigue siendo objetivo técnico; no hay manejo uniforme configurado.
  /planes/{planId}:
    patch:
      tags:
      - M1 · Membresías
      summary: Actualizar plan
      description: |-
        Sólo GERENTE. Actualiza nombre, duracionMeses, precio y/o activo.
        Campo omitido o null significa no modificar; {} conserva el plan. application/json, no JSON Merge Patch.
        activo=true permite reactivar un plan. Mismas validaciones de nombre, duración y precio que en creación.
        Plan inexistente produce 404; nombre duplicado o conflicto de integridad al guardar produce 409.
        Esta operación modifica el catálogo: no implementa renovación ni una política de períodos contratados.
        No se exige If-Match ni se emite ETag en el backend actual.
      operationId: actualizarPlan
      x-implementation-status: implemented
      x-contract-status: stable
      x-contract-basis: ActualizarPlanRequest, PlanResponse y PlanService actuales.
      responses:
        '200':
          description: Representación del plan después de la actualización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
      requestBody:
        required: true
        description: DTO actual de actualización parcial; todos sus campos son opcionales y admiten null.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPlanRequest'
      x-roles-actuales:
      - GERENTE
      x-permisos-objetivo:
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/membresia/controller/PlanController.java
      - src/main/java/com/fitzonesports/membresia/dto/ActualizarPlanRequest.java
      - src/main/java/com/fitzonesports/membresia/service/PlanService.java
      x-divergencias-backend:
      - El formato común Problem Details sigue siendo objetivo técnico; no hay manejo uniforme configurado.
    delete:
      tags:
      - M1 · Membresías
      summary: Desactivar plan
      description: |-
        Sólo GERENTE. Baja lógica: establece activo=false y devuelve 204 sin cuerpo,
        incluso si el plan ya estaba inactivo. Un plan inexistente produce 404.
        No elimina el plan ni las membresías/referencias existentes. PATCH con activo=true lo reactiva.
      operationId: desactivarPlan
      x-implementation-status: implemented
      x-contract-status: stable
      x-contract-basis: PlanController.desactivarPlan y PlanService.desactivarPlan actuales.
      responses:
        '204':
          description: Plan desactivado; respuesta sin cuerpo.
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      x-roles-actuales:
      - GERENTE
      x-permisos-objetivo:
      - GERENTE
      x-contract-source:
      - src/main/java/com/fitzonesports/membresia/controller/PlanController.java
      - src/main/java/com/fitzonesports/membresia/service/PlanService.java
      - src/test/java/com/fitzonesports/membresia/PlanServiceTest.java
      - src/test/java/com/fitzonesports/membresia/PlanPersistenceTest.java
      x-divergencias-backend:
      - El formato común Problem Details sigue siendo objetivo técnico; no hay manejo uniforme configurado.
    parameters:
    - $ref: '#/components/parameters/planId'
  /membresias/me:
    get:
      tags: [M1 · Membresías]
      summary: Consultar membresía propia e historial, incluso vencida

      description: |-
        RECEPCIONISTA y GERENTE. Valida el qrToken y abre un acceso (fecha_hora_salida nula).
        Validaciones, en orden: QR auténtico (firma y tipo; 400 si no lo es), no vencido (409), y que sea el último QR
        emitido para ese titular (409 si se emitió uno más nuevo). El titular sale del QR, no de un usuarioId enviado.
        El titular debe tener cuenta activa y membresía vigente no suspendida (403); M1 valida sus períodos.
        RN-01: si el titular ya tiene un ingreso abierto, en cualquier sede, responde 409; también ante escaneos
        simultáneos, por el índice único parcial uk_registro_acceso_abierto (V4).

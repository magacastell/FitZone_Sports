components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por login o registro. El servidor resuelve actor, permisos, propiedad y sede.
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          pattern: .*\S.*
          example: cliente@fitzone.com
        password:
          type: string
          writeOnly: true
          minLength: 1
          pattern: .*\S.*
          example: claveSegura123
      x-contract-status: stable
    LoginResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGllbnRlQGZpdHpvbmUuY29tIn0.firma
      x-contract-status: stable
    RegisterResponse:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGllbnRlQGZpdHpvbmUuY29tIn0.firma
      x-contract-status: stable
    RegisterRequest:
      type: object
      description: DTO actual. sedeId es obligatorio sin @Positive; el servidor comprueba existencia. El rol se
        asigna como CLIENTE_EXTERNO.
      required:
      - nombre
      - apellido
      - dni
      - email
      - password
      - sedeId
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: Ana
        apellido:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: Pérez
        dni:
          type: string
          minLength: 1
          pattern: .*\S.*
          example: '30123456'
        email:
          type: string
          format: email
          minLength: 1
          pattern: .*\S.*
          example: ana@ejemplo.com
        password:
          type: string
          minLength: 8
          pattern: .*\S.*
          writeOnly: true
          example: claveSegura123
        sedeId:
          type: integer
          format: int32
          example: 1
      x-contract-status: stable
    UsuarioResponse:
      type: object
      required:
      - id
      - nombre
      - apellido
      - dni
      - email
      - activo
      - rol
      - sedeId
      - sedeNombre
      - foto
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
        dni:
          type: string
          example: '30123456'
        email:
          type: string
          example: ana@ejemplo.com
        foto:
          type: string
          nullable: true
          example: perfil-ana.jpg
        activo:
          type: boolean
          example: true
        rol:
          type: string
          description: 'String del DTO actual. Roles sembrados: SOCIO_ACTIVO, CLIENTE_EXTERNO, RECEPCIONISTA y GERENTE.
            La política objetivo separa actor cliente de condición de membresía.'
          example: CLIENTE_EXTERNO
        sedeId:
          type: integer
          format: int32
          example: 1
        sedeNombre:
          type: string
          example: Centro
      x-contract-status: stable
    ActualizarPerfilRequest:
      type: object
      description: 'DTO actual: campo omitido o null significa no modificar. foto es String, no exige URL. No cambia
        email, DNI, rol, sede ni activo; no es JSON Merge Patch.'
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 255
          pattern: .*\S.*
          example: Ana
        apellido:
          type: string
          nullable: true
          maxLength: 255
          pattern: .*\S.*
          example: Pérez
        foto:
          type: string
          nullable: true
          maxLength: 255
          example: perfil-ana.jpg
      x-contract-status: stable
    ActualizarUsuarioRequest:
      type: object
      description: 'DTO actual: campo omitido o null significa no modificar. No cambia email, DNI, rol ni sede;
        no es JSON Merge Patch.'
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 255
          pattern: .*\S.*
          example: Ana
        apellido:
          type: string
          nullable: true
          maxLength: 255
          pattern: .*\S.*
          example: Pérez
        foto:
          type: string
          nullable: true
          maxLength: 255
          example: perfil-ana.jpg
        activo:
          type: boolean
          example: true
          nullable: true
      x-contract-status: stable
    SedeRequest:
      type: object
      required:
      - nombre
      - capacidadMaxima
      properties:
        nombre:
          type: string
          maxLength: 255
          minLength: 1
          pattern: .*\S.*
          example: Centro
        direccion:
          type: string
          maxLength: 255
          nullable: true
          example: Av. Principal 123
        capacidadMaxima:
          type: integer
          format: int32
          example: 100
          minimum: 1
      x-contract-status: stable
    ActualizarSedeRequest:
      type: object
      description: 'DTO actual: campo omitido o null significa no modificar; no es JSON Merge Patch.'
      properties:
        nombre:
          type: string
          maxLength: 255
          nullable: true
          pattern: .*\S.*
          example: Centro
        direccion:

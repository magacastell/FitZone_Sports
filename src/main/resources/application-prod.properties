# Perfil de produccion.
# El esquema NO se auto-genera: solo se valida contra lo que ya existe en la base
# (si no coincide, la app falla al arrancar en vez de alterar tablas solas).

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Nunca correr el seed de datos de prueba en produccion
spring.sql.init.mode=never

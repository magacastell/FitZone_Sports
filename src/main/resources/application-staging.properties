# Perfil de staging/testing: ambiente compartido para probar el sistema integrado
# antes de llegar a produccion (ej. para que el equipo o la catedra lo prueben).
# Usa su propia base de datos, distinta a la local y a la de produccion (via variables de entorno).

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Ambiente compartido: no se siembran los usuarios de prueba de dev en cada arranque
spring.sql.init.mode=never

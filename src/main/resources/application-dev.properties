# Perfil de desarrollo local.
# Flyway gestiona esquema y datos de demostracion versionados (V17, una sola vez).
# NUNCA usar este comportamiento contra una base de produccion.

# Fallback SOLO valido en dev: apunta al Postgres local, no se usa en staging ni en produccion
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitzone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# La ubicacion demo no se hereda en staging/prod; la migracion tambien comprueba el perfil.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.placeholders.demoProfiles=${spring.profiles.active}
spring.sql.init.mode=never

# Maven usa la misma versión para el WebJar y para su ruta de recursos.
fitzone.openapi.swagger-ui-version=@swagger-ui.version@

# Fallback SOLO valido en dev: clave de desarrollo, no se usa en staging ni en produccion
jwt.secret=${JWT_SECRET:LkjkuK2T+FKxVM6EbaT7sIEbmu31Gcn7zwd6h6bCeOE=}

# Perfil de desarrollo local.
# Flyway gestiona el esquema y se siembran datos de prueba con data.sql.
# NUNCA usar este comportamiento contra una base de produccion.

# Fallback SOLO valido en dev: apunta al Postgres local, no se usa en staging ni en produccion
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitzone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql se usa solo para datos de demostracion del perfil dev
spring.sql.init.mode=always


# Perfil de desarrollo local.
# Hibernate gestiona el esquema automaticamente y se siembran datos de prueba (data.sql).
# NUNCA usar este comportamiento contra una base de produccion.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql corre despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Fallback SOLO valido en dev: clave de desarrollo, no se usa en staging ni en produccion

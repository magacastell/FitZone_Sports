spring.application.name=FitZoneSports

# Perfil activo: OBLIGATORIO via variable de entorno SPRING_PROFILES_ACTIVE (dev, staging o prod).
# Sin default a proposito: si falta, la app falla al arrancar en vez de caer silenciosamente
# en el perfil mas permisivo (dev) en un deploy mal configurado.
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# PORT: la inyecta Render (u otra plataforma) en un deploy real; localmente cae al default 3000
server.port=${PORT:3000}
server.servlet.context-path=/api/v1

# PostgreSQL: SIN defaults aca (mismo criterio que jwt.secret). En dev, application-dev.properties
# los pisa con valores convenientes de desarrollo; en staging/prod son obligatorios via env vars.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway es la unica herramienta que modifica el esquema; Hibernate solo comprueba
# que las entidades sean compatibles con las migraciones aplicadas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# jwt.secret NO tiene default aca: en staging/prod es obligatorio via variable de entorno JWT_SECRET.
# Si falta, la app falla al arrancar (a proposito) en vez de usar una clave insegura conocida.
jwt.expiration=1h

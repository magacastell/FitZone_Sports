spring.application.name=FitZoneSports

server.port=3000
server.servlet.context-path=/api/v1

# PostgreSQL (el default de cada ${..:} es el de desarrollo local; en produccion se pisa con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitzone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed data.sql: correr despues de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT (default = clave de desarrollo compartida por el equipo; en produccion se pisa con JWT_SECRET)
jwt.secret=${JWT_SECRET:LkjkuK2T+FKxVM6EbaT7sIEbmu31Gcn7zwd6h6bCeOE=}
jwt.expiration=1h
spring.application.name=FitZoneSports

# Perfil activo: dev por defecto (desarrollo local).
# Se pisa con la variable de entorno SPRING_PROFILES_ACTIVE=staging o SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=3000
server.servlet.context-path=/api/v1

# PostgreSQL (el default de cada ${..:} es el de desarrollo local; en produccion se pisa con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitzone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# jwt.secret NO tiene default aca: en staging/prod es obligatorio via variable de entorno JWT_SECRET.
# Si falta, la app falla al arrancar (a proposito) en vez de usar una clave insegura conocida.
jwt.expiration=1h

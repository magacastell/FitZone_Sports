server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;     # si nginx redirige, que conserve el puerto del navegador
    client_max_body_size 5m;   # la foto de perfil admite hasta 2 MB

    # La API vive en el contenedor "backend" (el frontend llama a /api/v1 en el mismo origen, sin CORS).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aplicación de una sola página: cualquier ruta del frontend devuelve index.html.
    # No se prueba "$uri/": hay una carpeta estática /canchas/ (imágenes) y su ruta /canchas es una pantalla de la app.
    location / {
        try_files $uri /index.html;
    }
}

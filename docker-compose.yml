# Levanta todo el sistema con un comando:  docker compose up --build
#   frontend  http://localhost:8080   (portal del socio y consola de administración)
#   backend   http://localhost:3000   (API en /api/v1)
#   postgres  localhost:5432
# Usa el perfil "dev": crea el esquema con Flyway y carga los datos de demostración (25 sedes y los usuarios de prueba).
# Los puertos del equipo se pueden cambiar con POSTGRES_PORT, BACKEND_PORT y FRONTEND_PORT.
services:
  postgres:
    image: postgres:18
    container_name: fitzone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitzone
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fitzone_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitzone"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: fitzone-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/fitzone
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Carga la clave persistente del .env local al preparar M2 offline.
      FITZONE_OFFLINE_PRIVATE_KEY: "${FITZONE_OFFLINE_PRIVATE_KEY:-}"
      PORT: "3000"
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build: ./frontend
    container_name: fitzone-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  fitzone_pgdata:
